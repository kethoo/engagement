# Model to use (references models.yaml)
model: "llama_3_1_8b_ins"

# Template for wrapping personas
template: "Act as if you're {persona}."

# Suffix data file
suffix_data: "data/all_truncated_outputs.json"

# Suffix truncation settings
truncate_suffixes: true
truncate_offset: 0  # Use 0 for output suffixes, −5 for fact suffixes

# Positive personas (high extraversion)
positive_personas:
  - "extremely outgoing, energetic, sociable, and assertive"
  - "very enthusiastic, talkative, and energized by interaction"
  - "highly bold, confident, and proactive in group settings"

# Negative personas (low extraversion / introversion)
negative_personas:
  - "very introverted, quiet, reserved, and low-key"
  - "extremely subdued, prefers solitude, and avoids excessive social stimulation"
  - "highly passive, timid, and reluctant to take the lead"

# Training hyperparameters
batch_size: 32
method: "pca_center"